name: Publicar tabla compacta
on:
  push:
    paths: ['.github/workflows/tabla-compacta.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambio revisado
        run: |

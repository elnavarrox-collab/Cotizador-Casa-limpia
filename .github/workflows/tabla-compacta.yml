          +.addon-table th small { font-weight:normal; white-space:nowrap; }
          +.addon-table td { padding:3px 6px; border-bottom:1px solid #e4ede9; background:#fff; }
          +.addon-table tr:last-child td { border-bottom:0; }
          +.addon-table tbody tr:hover td { background:#f3f9f6; }
          +.addon-table input { height:34px; min-height:34px; padding:4px 8px; font-size:14px; border-color:transparent; box-shadow:none; background:transparent; }
          +.addon-table input:hover { border-color:#b8d0ca; }
          +.addon-table input[aria-invalid="true"] { border-color:#b14646; }
          +.addon-table td:nth-child(2) input,.addon-table td:nth-child(3) input { text-align:right; font-variant-numeric:tabular-nums; }

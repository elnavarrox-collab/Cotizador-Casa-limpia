name: Import project source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract validated source
        run: |
          unzip -o casa-limpia-source.zip
          rm casa-limpia-source.zip
          rm .github/workflows/import-source.yml

      - name: Publish complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar cotizador Casa Limpia"
          git push

name: Publicar Casa Limpia v4
on:
  push:
    paths:
      - '.github/workflows/publicar-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-casa-limpia-v4
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar paquete y base remota
        run: |
          test "$(git rev-parse HEAD~2)" = "5368e01635825aa6882defa8688d4897a70525ab"
          echo '410f39feff8f00fdb260d9f2aa0f6d7a3c64c319f97d40267361c19477c6f8e1  casa-limpia-725c28c.tar.gz' | sha256sum --check
          tar -xzf casa-limpia-725c28c.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publicar código validado y retirar importación temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- casa-limpia-725c28c.tar.gz .github/workflows/publicar-v4.yml
          git add -- app components lib public vendor tests README.md AGENTS.md CLAUDE.md .env.example .gitignore eslint.config.mjs next.config.ts package.json package-lock.json postcss.config.mjs proxy.ts tsconfig.json
          git commit -m 'feat: publicar paquetes v4 y correcciones QA (fuente 725c28c)'
          git push origin HEAD:main
